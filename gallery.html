          </button>
        </div>

        </figure>

        <figure class="figure">
          <img src="../Images/dogplay.png" data-i18n-attr="alt:imgAltOutdoor" alt="نزهة أحد الكلاب" />

        </figure>

          <div style="margin-top:6px"><strong data-i18n="phoneLabel">الهاتف</strong>: <a href="tel:+85200000000">0771363958</a></div>
